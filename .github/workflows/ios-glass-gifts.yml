name: iOS glass gifts

# Compiles and tests the native (Telegram-iOS) side of the glass gifts:
#   1. the Swift model replays the web prototype's golden frames (GlassTile, MotionSource;
#      tools/golden-gifts.mjs), plus the native-only motion and timing pieces,
#   2. the Telegram-facing module (ios/GlassGifts) and the patch's hooks typecheck for the iOS Simulator with
#      -warnings-as-errors against signature stubs of Display / AsyncDisplayKit.
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/GlassGifts/**'
      - 'ios/Standalone/GlassGifts*/**'
      - '.github/workflows/ios-glass-gifts.yml'

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Model — the Swift twin replays the web prototype's golden frames
        working-directory: ios/Standalone/GlassGiftsCore
        run: |
          mkdir -p Sources/GlassGiftsCore
          cp ../../GlassGifts/Sources/GlassTileModel.swift ../../GlassGifts/Sources/GlassGiftMotionFilter.swift Sources/GlassGiftsCore/
          if ! swift test -Xswiftc -warnings-as-errors > "$RUNNER_TEMP/test.log" 2>&1; then
            grep -E "error|failed|XCTAssert" "$RUNNER_TEMP/test.log" | head -120
            tail -40 "$RUNNER_TEMP/test.log"
            exit 1
          fi
          grep -E "Executed|passed|Test Suite" "$RUNNER_TEMP/test.log" | tail -20 || true

      - name: Swift — typecheck the module and the hooks for iOS
        working-directory: ios/Standalone/GlassGiftsTypeCheck
        run: |
          mkdir -p Sources/GlassGifts
          cp ../../GlassGifts/Sources/*.swift Sources/GlassGifts/
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          if ! swift build --sdk "$SDK" --triple arm64-apple-ios15.0-simulator -Xswiftc -warnings-as-errors > "$RUNNER_TEMP/build.log" 2>&1; then
            grep -vE "^\[[0-9]+/[0-9]+\]" "$RUNNER_TEMP/build.log" | tail -150
            exit 1
          fi
          grep -vE "^\[[0-9]+/[0-9]+\]" "$RUNNER_TEMP/build.log" | tail -20 || true
